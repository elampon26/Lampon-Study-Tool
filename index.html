<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Library</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2f6bff;--accent-ink:#ffffff;--accent-soft:#e8efff;
  --good:#16a34a;--warn:#d97706;--bad:#dc2626;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --warnbg:#fff4e0;--warnline:#f3d39b;--warnink:#8a5200;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--panel:#181b21;--ink:#eceef2;--muted:#9aa3b2;--line:#272b33;
  --accent:#6b93ff;--accent-ink:#0b1020;--accent-soft:#1c2540;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --warnbg:#3a2c10;--warnline:#5b4519;--warnink:#f2c47a}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
nav{width:230px;flex:none;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;padding:0 10px 10px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.subjsel{margin:0 0 12px;padding:0 4px}
.subjsel label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 6px 4px}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
nav button.nv{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button.nv:hover{background:var(--bg);color:var(--ink)}
nav button.nv.on{background:var(--accent-soft);color:var(--accent)}
.pill{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:12px;padding:1px 8px;font-weight:600}
main{flex:1;padding:34px clamp(18px,4vw,56px);max-width:980px;margin:0 auto;width:100%}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:17px;margin:28px 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat{padding:18px}
.stat b{display:block;font-size:30px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--accent-ink);padding:11px 20px;border-radius:12px;font-weight:600;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.area{padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;margin-bottom:10px}
.area:hover{border-color:var(--accent)}
.area .top{display:flex;justify-content:space-between;gap:12px}
.area .top span{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar .seen{background:var(--accent-soft);filter:saturate(1.4)}
.bar .solid{background:var(--accent)}
.legend{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);white-space:nowrap}
.chip.verify{background:var(--warnbg);border-color:var(--warnline);color:var(--warnink)}
.chip.ok{color:var(--good)}
.chip.due{background:var(--accent-soft);color:var(--accent);border-color:transparent}
/* study */
.study{max-width:740px;margin:0 auto}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px;gap:12px}
.chiprow{margin-bottom:12px}
.scene{perspective:1400px}
.flipper{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.flipper.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:270px;padding:30px clamp(18px,4vw,38px);display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px}
.face.bk{transform:rotateY(180deg);background:var(--panel)}
.face .tag{position:absolute;top:14px;left:20px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.face{position:relative}
.front{font-size:clamp(20px,2.6vw,27px);font-weight:600;letter-spacing:-.015em;line-height:1.3;white-space:pre-wrap}
.ans{font-size:clamp(17px,2.2vw,21px);white-space:pre-wrap;line-height:1.45}
.tap{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.below{margin-top:18px;animation:in .3s ease-out}
.below[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rate{all:unset;cursor:pointer;text-align:center;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.rate small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.rate:hover{border-color:var(--accent)}
.rate.r1{color:var(--bad)}.rate.r2{color:var(--warn)}.rate.r3{color:var(--good)}.rate.r4{color:var(--accent)}
.panel{margin-top:14px;padding:16px 18px}
.panel .hd{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.panel ul{margin:0;padding-left:18px}
.panel + .panel{margin-top:12px}
.src{color:var(--muted);font-size:14px}
.vbox{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warnbg);border:1px solid var(--warnline);color:var(--warnink);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
kbd{font:12px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
textarea,input[type=text],input[type=number],input[type=search],input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
/* lists */
.list .item{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.list .item:last-child{border-bottom:0}
.list .item.click{cursor:pointer}
.list .item.click:hover{background:var(--bg)}
.list .main{flex:1;min-width:0}
.list .t{font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.list .m{color:var(--muted);font-size:13px;margin-top:2px}
.list input[type=checkbox]{margin-top:5px;width:17px;height:17px;accent-color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted);background:var(--panel)}
.tab.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.banner{background:var(--warnbg);border:1px solid var(--warnline);color:var(--warnink);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
.label{display:block;font-weight:600;margin:16px 0 6px}
.label small{font-weight:400;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.spark{display:flex;gap:4px;align-items:flex-end;height:46px;margin-top:8px}
.spark i{flex:1;background:var(--accent);border-radius:3px;min-height:3px;opacity:.85}
.spark i.z{background:var(--line);opacity:1}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:40}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);width:100%;max-width:620px;padding:22px}
#modal h2{margin:0 0 4px}
.check{display:flex;gap:8px;align-items:center;margin-top:14px}
.check input{width:17px;height:17px;accent-color:var(--accent)}
@media (max-width:760px){
  .app{flex-direction:column}
  nav{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{width:100%;padding:0 6px 6px}
  .subjsel{width:100%}
  .rates{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.flipper{transition:none}.below{animation:none}}
.pill.warn{background:var(--warn);color:#fff}
nav button.nv kbd{margin-left:auto}
.selbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px}
.selbar .selt{font-size:14px}
.selbar .lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-right:4px}
.selbar .chips{flex:1;min-width:160px}
.links{margin:0;padding-left:18px}
.links a,.panel a{color:var(--accent);overflow-wrap:anywhere}
label.item{cursor:pointer}
label.item:hover{background:var(--bg)}
.check input[type=radio]{width:17px;height:17px;accent-color:var(--accent)}
strong{font-weight:800}
.front strong,.ans strong{color:var(--accent)}
.gmenu{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.gcard{padding:18px;display:flex;flex-direction:column;gap:8px}
.gcard h3{margin:0;font-size:18px;letter-spacing:-.01em}
.gcard p{margin:0;color:var(--muted);font-size:14px}
.gcard .m{color:var(--muted);font-size:13px}
.gcard .btn{align-self:flex-start;margin-top:4px}
.scl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.gtop{display:flex;gap:16px;align-items:baseline;margin-bottom:10px}
.gtop #gtime{font-size:26px;font-weight:700;letter-spacing:-.02em;min-width:56px}
.gtop .gs{color:var(--muted);font-size:14px}.gtop .gs b{color:var(--ink)}
.gbarw{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.gbarw i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .1s linear}
.gq{padding:24px clamp(16px,4vw,32px);margin-bottom:14px}
.gopts{display:grid;gap:10px}
.gopt{all:unset;cursor:pointer;box-sizing:border-box;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:block;line-height:1.4}
.gopt:hover{border-color:var(--accent)}
.gopt kbd{margin-right:8px}
.gopt.good{border-color:var(--good);background:rgba(22,163,74,.12)}
.gopt.bad{border-color:var(--bad);background:rgba(220,38,38,.12)}
.gopt[disabled]{cursor:default}
.gwhy{margin:-4px 4px 6px;color:var(--muted);font-size:14px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.mcols>div{display:grid;gap:10px}
.mbtn{all:unset;cursor:pointer;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);line-height:1.35;font-size:15px}
.mbtn:hover{border-color:var(--accent)}
.mbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.mbtn.done{opacity:.35;border-color:var(--good);cursor:default}
.mbtn.bad{border-color:var(--bad);background:rgba(220,38,38,.12)}
@media (max-width:760px){.mcols{gap:8px}.mbtn{font-size:14px;padding:10px}}

/* ---- v3.1 refresh ---- */
:root{--shadow:0 1px 2px rgba(16,24,40,.05);--r:14px}
@media (prefers-color-scheme:dark){:root{--shadow:0 1px 2px rgba(0,0,0,.4)}}
.card,.stat{border-radius:var(--r)}
#topbar{display:none}
nav .brand small{display:none}
nav button.nv{gap:12px;justify-content:flex-start}
nav button.nv svg{width:20px;height:20px;flex:none}
nav button.nv .lb{flex:1}
nav button.nv .pill,nav button.nv kbd{margin-left:auto}
nav button.nv.more,nav button.nv .dot{display:none}
nav .navsep{height:1px;background:var(--line);margin:10px 6px}
nav button.nv.sec{font-size:14px}
.selline{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin:-10px 0 18px}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}.link[disabled]{opacity:.4;pointer-events:none}
.iconbtn{all:unset;cursor:pointer;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);flex:none}
.iconbtn svg{width:20px;height:20px}
.hero{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--accent-soft),var(--panel) 70%)}
.hero .big{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .cap{color:var(--muted);font-size:14px;margin-top:6px}
.hero .btn{padding:14px 28px;font-size:16px}
.sublinks{display:flex;gap:8px 20px;flex-wrap:wrap;margin:14px 2px 0}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mini .stat{padding:14px 16px}.mini .stat b{font-size:22px}.mini .stat b small{font-size:14px;color:var(--muted);font-weight:500}
.covcard{padding:2px 18px}
.covrow{padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.covrow:last-child{border-bottom:0}.covrow:hover b{color:var(--accent)}
.covrow .top{display:flex;justify-content:space-between;gap:12px}.covrow .top span{color:var(--muted);font-size:13px}
.mrow{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex!important;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:500}
.mrow:last-child{border-bottom:0}.mrow svg{width:22px;height:22px;color:var(--muted)}
h1{font-size:26px}
@media (max-width:760px){
  .app{display:block}
  #topbar{display:flex;gap:10px;position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px;align-items:center}
  #topbar select{flex:1;font-weight:600}
  nav{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;flex-wrap:nowrap;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);border-bottom:0;z-index:30;gap:0}
  nav .brand,nav .subjsel,nav .navsep,nav button.nv.sec{display:none}
  nav button.nv{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:7px 2px;align-items:center;justify-content:center;position:relative;border-radius:12px}
  nav button.nv .lb{flex:none}
  nav button.nv.more{display:flex}
  nav button.nv .pill{position:absolute;top:2px;left:calc(50% + 6px);margin:0;font-size:10px;padding:0 6px;line-height:16px}
  nav button.nv .dot{display:block;position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--warn)}
  main{padding:14px 16px 100px}
  h1{font-size:24px}
  .hero{padding:20px}.hero .big{font-size:40px}.hero .btn{width:100%}
  #toast{bottom:88px;max-width:90vw}
}

.gcard.wide{grid-column:1/-1}
.gcard .scl{flex-direction:row;flex-wrap:wrap;gap:8px}
/* v4 */
.cimg{max-width:100%;max-height:230px;object-fit:contain;display:block;margin:12px auto 0;border-radius:10px}
.cimg[hidden]{display:none}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.mo-areas{display:grid;gap:2px}
.printonly{display:none}
.cheat{column-gap:28px}
.cs-group{break-inside:avoid;margin-bottom:14px}
.cs-group h3{margin:0 0 6px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:3px}
.cs-item{padding:5px 0;font-size:14px}
.cs-q{font-weight:600}
.cs-a{color:var(--ink)}
@media (min-width:900px){.cheat{columns:2}}
@media print{
  nav,#nav,#topbar,#toast,.noprint,#modal{display:none!important}
  body,main,#main{background:#fff!important;color:#000!important;margin:0!important;padding:0!important}
  .printonly{display:block}
  .cheat{columns:2;font-size:11px}
  .cs-item{padding:2px 0;font-size:11px}
  h1,.sub,.seg{display:none!important}
}
/* v5 */
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1115;--panel:#181b21;--ink:#eceef2;--muted:#9aa3b2;--line:#272b33;--accent:#6b93ff;--accent-ink:#0b1020;--accent-soft:#1c2540;--shadow:0 1px 2px rgba(0,0,0,.4);--warnbg:#3a2c10;--warnline:#5b4519;--warnink:#f2c47a}
:root[data-theme="light"]{color-scheme:light;--bg:#f5f6f8;--panel:#ffffff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--accent:#2f6bff;--accent-ink:#ffffff;--accent-soft:#e8efff;--shadow:0 1px 2px rgba(16,24,40,.05);--warnbg:#fff4e0;--warnline:#f3d39b;--warnink:#8a5200}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:600;padding:0 6px;margin:0 2px}
.clx{margin-top:10px;font-size:.92em;color:var(--muted)}
.gq .cx{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
pre.metar{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;margin:0 0 12px}
.slots{display:grid;gap:6px;margin:12px 0}
.slot{display:flex;gap:10px;align-items:center;min-height:42px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--panel)}
.slot b{min-width:1.6em;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--good);background:var(--accent-soft)}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chipbtn{width:auto;text-align:left}
.acr{display:inline-block;margin-left:8px;font-size:.8em;letter-spacing:.12em;color:var(--accent)}
.dcard{margin-bottom:14px}
/* v5.1 safe areas and small screens */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
@media (max-width:760px){
  nav{padding:6px max(14px,calc(var(--sal) + 8px)) calc(8px + var(--sab)) max(14px,calc(var(--sar) + 8px));gap:2px}
  nav button.nv{min-width:0;padding:7px 0}
  nav button.nv .lb{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #topbar{padding:calc(10px + var(--sat)) max(16px,calc(var(--sar) + 8px)) 10px max(16px,calc(var(--sal) + 8px))}
  main{padding:14px max(16px,calc(var(--sar) + 8px)) calc(104px + var(--sab)) max(16px,calc(var(--sal) + 8px))}
  #toast{bottom:calc(88px + var(--sab))}
  #modal .box{margin-bottom:var(--sab)}
}
@media (max-width:370px){
  nav button.nv{font-size:10px}
  nav button.nv svg{width:20px;height:20px}
  .hero .big{font-size:40px}
}
@media (max-width:760px) and (max-height:480px){
  nav button.nv{flex-direction:row;gap:6px;padding:4px 0}
  main{padding-bottom:calc(64px + var(--sab))}
}

<div class="app">

</div>

<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,.csv,.tsv,.txt,application/json,text/csv,text/plain" multiple hidden>
<script>
(function(){
'use strict';
var DAY=86400000;
var KEY='checkride-study-v1',SNAPKEY='checkride-study-snap',UNDOKEY='checkride-study-before-restore',VER=3;

/* ---------- storage ---------- */
var FLIGHT_RE=/pilot|flight|flying|aviation|checkride|aircraft|taefc/i;
function defaults(){return{v:VER,subjects:{},decks:{},progress:{},notes:{},overrides:{},flags:{},settings:{newPerDay:20,autoDownload:false,staleDays:180,mix:'mixed',theme:'auto',wxStations:'KICT,KMCI,KSTL,KDEN,KORD,KATL,KSEA,KPHX,KBOS,KMIA'},daily:{date:'',newCount:0},history:{},cheat:{},mocks:[],dc:{date:'',streak:0,best:0,right:0,n:0},wx:null,lastBackup:0,lastAuto:0,currentSubject:'',sel:{},sets:{}};}
function migrate(s){
  var base=defaults();for(var k in s)base[k]=s[k];
  var df=defaults().settings;if(!base.settings||typeof base.settings!=='object')base.settings={};
  for(var q in df)if(base.settings[q]===undefined)base.settings[q]=df[q];
  if(!base.sel||typeof base.sel!=='object')base.sel={};
  if(!base.sets||typeof base.sets!=='object')base.sets={};
  s=base;
  if(!s.cheat||typeof s.cheat!=='object')s.cheat={};
  if(!Array.isArray(s.mocks))s.mocks=[];
  if(!s.dc||typeof s.dc!=='object')s.dc={date:'',streak:0,best:0,right:0,n:0};
  var ids=Object.keys(s.decks),orphan=ids.filter(function(i){return !s.decks[i].subject;});
  if(orphan.length){
    if(!s.subjects['private-pilot'])s.subjects['private-pilot']={id:'private-pilot',name:'Private Pilot',examDate:''};
    orphan.forEach(function(i){s.decks[i].subject='private-pilot';});
  }
  Object.keys(s.subjects).forEach(function(k){var x=s.subjects[k];if(x.flight===undefined)x.flight=FLIGHT_RE.test(x.name||'');});
  var sk=Object.keys(s.subjects);
  if(!s.currentSubject||!s.subjects[s.currentSubject])s.currentSubject=sk[0]||'';
  s.v=VER;return s;
}
var loadWarn='',readOnly=false;
function load(){
  var r=null;
  try{r=localStorage.getItem(KEY);}catch(e){}
  if(r){
    try{
      var o=JSON.parse(r),v=o.v||1;
      if(v>VER){readOnly=true;loadWarn='This data was saved by a newer version of the app. Open the newer version; changes made here will not be saved.';}
      else if(v<VER){try{localStorage.setItem(KEY+'-before-v'+VER,r);}catch(e1){}}
      return migrate(o);
    }catch(e2){
      try{localStorage.setItem(KEY+'-corrupt',r);}catch(e3){}
      loadWarn='Your saved data could not be read, so the app started empty. A copy of the damaged data was kept in this browser. Restore a backup file from Settings.';
    }
  }
  return migrate(defaults());
}
var S=load();
function save(){
  if(readOnly)return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast('Could not save. Browser storage may be full or blocked. Export a backup now.');}
}
/* a daily snapshot of the state at the start of the day; keeps the last three */
function snapshot(){
  try{
    if(readOnly||!Object.keys(S.decks).length)return;
    var arr=JSON.parse(localStorage.getItem(SNAPKEY)||'[]'),t=isoToday();
    if(arr.length&&arr[arr.length-1].date===t)return;
    arr.push({date:t,data:JSON.stringify(S)});
    while(arr.length>3)arr.shift();
    try{localStorage.setItem(SNAPKEY,JSON.stringify(arr));}
    catch(e){try{localStorage.setItem(SNAPKEY,JSON.stringify(arr.slice(-1)));}catch(e2){}}
  }catch(e3){}
}
function getSnaps(){try{return JSON.parse(localStorage.getItem(SNAPKEY)||'[]');}catch(e){return [];}}
var persistState='unknown';
function checkPersist(){
  if(!(navigator.storage&&navigator.storage.persisted)){persistState='unsupported';return;}
  navigator.storage.persisted().then(function(p){
    if(p){persistState='granted';return;}
    persistState='not-granted';
    if(navigator.storage.persist)return navigator.storage.persist().then(function(g){persistState=g?'granted':'denied';});
  }).then(function(){if(view==='settings')render();}).catch(function(){persistState='unsupported';});
}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function summarize(m){var bad=m.filter(function(x){return !/^(Imported|Updated) /.test(x);});return m.length>2?(m.length-bad.length)+' files imported'+(bad.length?'. '+bad.join(' | '):''):m.join(' | ');}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},3200);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';}
function fmtInt(ms){
  var m=Math.round(ms/60000);
  if(m<60)return Math.max(1,m)+'m';
  var h=Math.round(m/60);if(h<24)return h+'h';
  var d=Math.round(h/24);if(d<30)return d+'d';
  return Math.round(d/30)+'mo';
}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmt(s){return esc(s).replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>').replace(/\{\{|\}\}/g,'');}
function plain(s){return String(s==null?'':s).replace(/\*\*/g,'').replace(/\{\{|\}\}/g,'');}
function toggleBold(id){
  var t=$(id);if(!t)return;
  var a=t.selectionStart,b=t.selectionEnd,v=t.value;
  if(a===b){toast('Select the text first, then press Bold.');return;}
  var sel=v.slice(a,b),wrapped=sel.length>4&&sel.slice(0,2)==='**'&&sel.slice(-2)==='**';
  var ns=wrapped?sel.slice(2,-2):'**'+sel+'**';
  t.value=v.slice(0,a)+ns+v.slice(b);t.focus();t.setSelectionRange(a,a+ns.length);
}
function isoToday(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function safeUrl(u){return /^https?:\/\//i.test(String(u||''))?String(u):'';}
function ytSearch(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q);}
function normLinks(arr){
  var out=[];if(!Array.isArray(arr))return out;
  arr.forEach(function(l){
    if(!l||typeof l!=='object')return;
    var url=safeUrl(l.url),label=typeof l.label==='string'?l.label.trim():'';
    if(!url&&typeof l.q==='string'&&l.q.trim()){url=ytSearch(l.q.trim());if(!label)label='YouTube search: '+l.q.trim();}
    if(url)out.push({label:label||url.replace(/^https?:\/\/(www\.)?/i,'').split('/')[0],url:url});
  });
  return out;
}
function parseLinks(text){
  var arr=[],bad=0;
  String(text).split('\n').forEach(function(ln){
    ln=ln.trim();if(!ln)return;
    var m=/^search:\s*(.+)$/i.exec(ln);
    if(m){arr.push({q:m[1]});return;}
    var i=ln.lastIndexOf('|'),label='',url=ln;
    if(i>=0){label=ln.slice(0,i).trim();url=ln.slice(i+1).trim();}
    if(safeUrl(url))arr.push({label:label,url:url});else bad++;
  });
  return {links:normLinks(arr),bad:bad};
}
function fmtLinks(links){return (links||[]).map(function(l){return l.label+' | '+l.url;}).join('\n');}
function stale(c){
  if(!c.volatile)return false;
  if(!c.checked)return true;
  return (Date.now()-new Date(c.checked+'T00:00:00').getTime())/DAY>((S.settings.staleDays|0)||180);
}
function attn(c){return !!c.verify||stale(c);}
function hay(c){return [c.front,c.back,c.area,c.task,c.acs,c.source,c.page,S.notes[c.key]||'',(c.links||[]).map(function(l){return l.label;}).join(' ')].join(' ').toLowerCase();}

/* ---------- subjects & cards ---------- */
function subj(){return S.subjects[S.currentSubject]||null;}
function areaOf(c){return c.area||'General';}
function applyOv(c,key){
  var o={};for(var k in c)o[k]=c[k];
  o.key=key;o.deckId=key.slice(0,key.indexOf(':'));
  var ov=S.overrides[key];
  if(ov){for(var f in ov)o[f]=ov[f];o.edited=Object.keys(ov).some(function(f){return f!=='verify'&&f!=='checked';});o.hasOv=true;}
  return o;
}
function cardsInSubject(sid){
  var out=[];
  Object.keys(S.decks).forEach(function(id){
    var d=S.decks[id];if(d.subject!==sid)return;
    d.cards.forEach(function(c){out.push(applyOv(c,id+':'+c.id));});
  });
  return out;
}
function allCards(){return cardsInSubject(S.currentSubject);}
/* decks chosen for study: a saved selection (may span subjects) or every deck in the current subject */
function selIds(){
  var sel=S.sel[S.currentSubject];
  if(sel&&sel.length){var ok=sel.filter(function(i){return S.decks[i];});if(ok.length)return ok;}
  return Object.keys(S.decks).filter(function(i){return S.decks[i].subject===S.currentSubject;});
}
function isCustomSel(){var s=S.sel[S.currentSubject];return !!(s&&s.length&&s.some(function(i){return S.decks[i];}));}
function activeCards(){
  var out=[];
  selIds().forEach(function(id){S.decks[id].cards.forEach(function(c){out.push(applyOv(c,id+':'+c.id));});});
  return out;
}
function getCard(key){
  var i=key.indexOf(':'),d=S.decks[key.slice(0,i)];if(!d)return null;
  var id=key.slice(i+1);
  for(var j=0;j<d.cards.length;j++)if(d.cards[j].id===id)return applyOv(d.cards[j],key);
  return null;
}
function updateCard(key,patch){
  var i=key.indexOf(':'),d=S.decks[key.slice(0,i)],id=key.slice(i+1);
  if(d.custom){
    for(var j=0;j<d.cards.length;j++)if(d.cards[j].id===id){for(var f in patch)d.cards[j][f]=patch[f];}
  }else{
    var ov=S.overrides[key]||{};for(var f2 in patch)ov[f2]=patch[f2];S.overrides[key]=ov;
  }
  save();
}
function myDeck(sid){
  var id='my-'+sid;
  if(!S.decks[id])S.decks[id]={id:id,title:'My cards',standard:'Cards I wrote',subject:sid,custom:true,cards:[]};
  return S.decks[id];
}

/* ---------- scheduling ---------- */
function schedule(p,r){
  var now=Date.now();
  var s=p?{ease:p.ease,interval:p.interval,reps:p.reps,lapses:p.lapses}:{ease:2.5,interval:0,reps:0,lapses:0};
  if(r===1){s.lapses++;s.ease=Math.max(1.3,s.ease-0.2);s.interval=0;s.reps=0;s.due=now+10*60000;}
  else{
    if(r===2){s.ease=Math.max(1.3,s.ease-0.15);s.interval=s.interval<1?1:Math.max(1,Math.round(s.interval*1.2));}
    else if(r===3){s.interval=s.interval<1?1:(s.reps===1?3:Math.max(s.interval+1,Math.round(s.interval*s.ease)));}
    else{s.ease=s.ease+0.15;s.interval=s.interval<1?4:Math.max(s.interval+2,Math.round(s.interval*s.ease*1.3));}
    s.reps++;s.due=now+s.interval*DAY;
  }
  s.last=now;return s;
}
function newLeft(){var used=(S.daily.date===today())?S.daily.newCount:0;return Math.max(0,(S.settings.newPerDay|0)-used);}
function interleave(cards){
  var g={},order=[];
  cards.forEach(function(c){if(!g[c.deckId]){g[c.deckId]=[];order.push(c.deckId);}g[c.deckId].push(c);});
  var out=[],more=true,i=0;
  while(more){more=false;order.forEach(function(d){if(g[d][i]){out.push(g[d][i]);more=true;}});i++;}
  return out;
}
function dueQueue(cards){
  var now=Date.now(),mixed=S.settings.mix!=='deck';
  var due=cards.filter(function(c){var p=S.progress[c.key];return p&&p.due<=now;}).sort(function(a,b){
    if(!mixed&&a.deckId!==b.deckId)return a.deckId<b.deckId?-1:1;
    return S.progress[a.key].due-S.progress[b.key].due;});
  var fresh=cards.filter(function(c){return !S.progress[c.key];});
  if(mixed)fresh=interleave(fresh);
  return due.concat(fresh.slice(0,newLeft()));
}
function isWeak(c){var p=S.progress[c.key];return !!p&&(p.lapses>0&&p.interval<7);}
function stateOf(c){
  var p=S.progress[c.key];if(!p)return 'new';
  if(p.due<=Date.now())return 'due';
  return p.interval>=3?'solid':'learning';
}

/* ---------- state ---------- */
var view='home',session=null,vq=null,pick=null;
var lib={topic:null,filter:'all',q:'',sel:{}};
var navEl=$('nav'),mainEl=$('main');

/* ---------- render ---------- */
function render(){if(view!=='games')stopGame();if(view==='checkride'&&!isFlight())view='home';renderNav();
  if(!Object.keys(S.subjects).length&&view!=='settings'){renderWelcome();return;}
  if(view==='home')renderHome();else if(view==='study')renderStudy();else if(view==='library')renderLibrary();else if(view==='verify')renderVerify();else if(view==='games')renderGames();else if(view==='checkride')renderCheckride();else renderSettings();
}
var ICONS={theme:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',check:'<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',study:'<rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/>',games:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',library:'<path d="M4 4h5v16H4zM11 4h4v16h-4zM17.5 5.5l3.2.9-3.6 13.6-3.2-.9z"/>',more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',verify:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',settings:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.4-1 .9-1 1.6M12 17h.01"/>'};
function ic(n){if(n==='checkride')n='check';return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';}
function subjOpts(){
  var h='';var ks=Object.keys(S.subjects),fl=ks.filter(function(k){return S.subjects[k].flight;}),ot=ks.filter(function(k){return !S.subjects[k].flight;});
  function opt(k){return '<option value="'+esc(k)+'"'+(k===S.currentSubject?' selected':'')+'>'+esc(S.subjects[k].name)+'</option>';}
  if(fl.length&&ot.length){h+='<optgroup label="Flight">'+fl.map(opt).join('')+'</optgroup><optgroup label="Other courses">'+ot.map(opt).join('')+'</optgroup>';return h+'<option value="__new">+ New subject...</option>';}
  Object.keys(S.subjects).forEach(function(k){h+='<option value="'+esc(k)+'"'+(k===S.currentSubject?' selected':'')+'>'+esc(S.subjects[k].name)+'</option>';});
  return h+'<option value="__new">+ New subject...</option>';
}
function renderNav(){
  var sk=Object.keys(S.subjects);
  var q=sk.length?dueQueue(activeCards()).length:0,vc=sk.length?allCards().filter(attn).length:0;
  var h='<div class="brand">Study Library</div><div class="subjsel"><select id="subjSel" aria-label="Subject">'+subjOpts()+'</select></div>';
  var pri=[['home','Home'],['study','Study'],['games','Games'],['library','Library']];
  if(sk.length&&isFlight())pri.push(['checkride','Checkride']);
  pri.forEach(function(it){
    var n=it[0]==='study'?q:0;
    h+='<button class="nv pri'+(view===it[0]?' on':'')+'" data-act="nav" data-v="'+it[0]+'">'+ic(it[0])+'<span class="lb">'+it[1]+'</span>'+(n?'<span class="pill">'+n+'</span>':'')+'</button>';
  });
  h+='<div class="navsep"></div>';
  h+='<button class="nv sec'+(view==='verify'?' on':'')+'" data-act="nav" data-v="verify">'+ic('verify')+'<span class="lb">Verify queue</span>'+(vc?'<span class="pill warn">'+vc+'</span>':'')+'</button>';
  h+='<button class="nv sec'+(view==='settings'?' on':'')+'" data-act="nav" data-v="settings">'+ic('settings')+'<span class="lb">Settings</span></button>';
  h+='<button class="nv sec" data-act="search">'+ic('search')+'<span class="lb">Search</span><kbd>/</kbd></button>';
  h+='<button class="nv sec" data-act="help">'+ic('help')+'<span class="lb">Shortcuts</span><kbd>?</kbd></button>';
  h+='<button class="nv sec" data-act="theme">'+ic('theme')+'<span class="lb">Theme: '+themeLabel()+'</span></button>';
  h+='<button class="nv more'+((view==='verify'||view==='settings')?' on':'')+'" data-act="more">'+ic('more')+'<span class="lb">More</span>'+(vc?'<i class="dot"></i>':'')+'</button>';
  navEl.innerHTML=h;
  var tb=$('topbar');if(tb)tb.innerHTML='<select id="subjSel2" aria-label="Subject">'+subjOpts()+'</select><button class="iconbtn" data-act="search" aria-label="Search">'+ic('search')+'</button>';
}
function openMore(){
  var vc=allCards().filter(attn).length;
  var h='<div class="box"><div class="card list">';
  [['verify','Verify queue'+(vc?' ('+vc+')':'')],['settings','Settings']].forEach(function(it){h+='<button class="item click mrow" data-act="nav" data-v="'+it[0]+'">'+ic(it[0])+'<span>'+it[1]+'</span></button>';});
  h+='<button class="item click mrow" data-act="search">'+ic('search')+'<span>Search all cards</span></button><button class="item click mrow" data-act="help">'+ic('help')+'<span>Keyboard shortcuts</span></button><button class="item click mrow" data-act="theme">'+ic('theme')+'<span>Theme: '+themeLabel()+'</span></button></div></div>';
  $('modal').innerHTML=h;$('modal').classList.add('on');
}
function backupBanner(){
  var w=loadWarn?'<div class="banner">'+esc(loadWarn)+'</div>':'';
  if(!Object.keys(S.progress).length&&!Object.keys(S.notes).length&&!Object.keys(S.overrides).length)return w;
  if(Date.now()-(S.lastBackup||0)>3*DAY)w+='<div class="banner">'+(S.lastBackup?'Your last backup was '+Math.floor((Date.now()-S.lastBackup)/DAY)+' days ago.':'You have not made a backup yet.')+' Go to Settings and export one. Your progress lives only in this browser.</div>';
  return w;
}
function selbar(q){
  var ids=selIds(),custom=isCustomSel(),n=ids.length;
  return '<div class="selline"><span>'+(custom?n+' selected deck'+(n===1?'':'s'):'All '+n+' deck'+(n===1?'':'s'))+'</span><button class="link" data-act="pickdecks">Change</button></div>';
}
function renderWelcome(){
  mainEl.innerHTML=backupBanner()+'<h1>Welcome</h1><p class="sub">Create a subject (for example "Private Pilot" or "Accounting 201"), then import decks or write your own cards.</p>'+
    '<div class="card empty"><div class="row" style="justify-content:center"><button class="btn" data-act="newsubj">Create a subject</button><button class="btn ghost" data-act="import">Import a deck file</button></div></div>';
}

function streak(){
  var n=0,d=new Date();
  function key(x){return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();}
  if(!S.history[key(d)])d=new Date(d.getTime()-DAY);
  while(S.history[key(d)]){n++;d=new Date(d.getTime()-DAY);}
  return n;
}
function renderHome(){
  var cards=activeCards(),sb=subj();
  var h='<h1>'+esc(sb.name)+'</h1>';
  if(!cards.length){
    mainEl.innerHTML=h+'<p class="sub">No cards in this subject yet.</p><div class="card empty"><div class="row" style="justify-content:center"><button class="btn" data-act="import">Import a deck</button><button class="btn ghost" data-act="addcard">Write a card</button></div></div>';return;
  }
  var now=Date.now(),due=0,seen=0,solid=0,verify=0,weak=0,areas={};
  cards.forEach(function(c){
    var p=S.progress[c.key],a=areaOf(c);if(!areas[a])areas[a]={n:0,seen:0,solid:0};
    areas[a].n++;
    if(p){seen++;areas[a].seen++;if(p.due<=now)due++;if(p.interval>=3){solid++;areas[a].solid++;}}
    if(attn(c))verify++;if(isWeak(c))weak++;
  });
  var q=dueQueue(cards);
  var sub=q.length?q.length+' cards in today\'s session.':'You are all caught up for now.';
  if(sb.examDate){
    var dl=Math.ceil((new Date(sb.examDate+'T00:00:00')-new Date())/DAY),unseen=cards.length-seen;

function download(name,obj){
  var blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function ensureSubject(name){
  var id=slug(name);
  for(var k in S.subjects)if(k===id||S.subjects[k].name.toLowerCase()===String(name).toLowerCase())return k;
  S.subjects[id]={id:id,name:name,examDate:'',flight:FLIGHT_RE.test(name)};return id;
}
function normScenarios(arr,fname){
  if(arr==null)return [];
  if(!Array.isArray(arr))throw new Error(fname+': "scenarios" must be a list.');
  var seen={};
  return arr.map(function(s,i){
    if(!s||typeof s.id!=='string'||!s.id||typeof s.title!=='string'||!Array.isArray(s.steps)||!s.steps.length)throw new Error(fname+': scenario #'+(i+1)+' needs id, title and steps.');
    if(seen[s.id])throw new Error(fname+': duplicate scenario id "'+s.id+'".');seen[s.id]=1;
    var steps=s.steps.map(function(st,j){
      if(!st||typeof st.q!=='string'||!st.q.trim()||!Array.isArray(st.choices)||st.choices.length<2)throw new Error(fname+': scenario "'+s.id+'" step '+(j+1)+' needs a question and at least two choices.');
      var ch=st.choices.map(function(c){if(!c||typeof c.t!=='string'||!c.t.trim())throw new Error(fname+': scenario "'+s.id+'" step '+(j+1)+' has an empty choice.');return {t:c.t,ok:!!c.ok,why:typeof c.why==='string'?c.why:''};});
      if(!ch.some(function(c){return c.ok;}))throw new Error(fname+': scenario "'+s.id+'" step '+(j+1)+' has no correct choice.');
      return {q:st.q,choices:ch};
    });
    return {id:s.id,title:s.title,area:typeof s.area==='string'?s.area:'',intro:typeof s.intro==='string'?s.intro:'',verify:!!s.verify,steps:steps};
  });
}
function importDeck(obj,fname){
  if(!obj||!obj.deck||!Array.isArray(obj.cards))throw new Error(fname+': not a deck file (needs "deck" and "cards").');
  var d=obj.deck;
  if(!d.id||typeof d.id!=='string')throw new Error(fname+': deck.id is missing.');
  var seen={},cards=[];
  obj.cards.forEach(function(c,i){
    if(!c||typeof c.id!=='string'||!c.id)throw new Error(fname+': card #'+(i+1)+' has no id.');
    if(!c.type&&typeof c.front==='string'&&(c.back==null||!String(c.back).trim())&&/\{\{.+?\}\}/.test(c.front))c.type='cloze';
    if(c.type==='cloze'){if(typeof c.front!=='string'||!/\{\{.+?\}\}/.test(c.front))throw new Error(fname+': fill-in-the-blank card "'+c.id+'" needs {{hidden words}} in its text.');c.back=typeof c.back==='string'?c.back:'';}
    else if(typeof c.front!=='string'||typeof c.back!=='string'||!c.front.trim()||!c.back.trim())throw new Error(fname+': card "'+c.id+'" needs front and back text.');
    if(seen[c.id])throw new Error(fname+': duplicate card id "'+c.id+'".');
    seen[c.id]=1;
    cards.push({id:c.id,area:c.area||'',task:c.task||'',acs:c.acs||'',type:c.type||'',front:c.front,back:c.back,
      followups:Array.isArray(c.followups)?c.followups.filter(function(x){return typeof x==='string';}):[],source:c.source||'',verify:!!c.verify,
      image:safeImg(c.image),page:typeof c.page==='string'?c.page:'',volatile:!!c.volatile,checked:/^\d{4}-\d{2}-\d{2}$/.test(c.checked||'')?c.checked:'',links:normLinks(c.links)});
  });
  var old=S.decks[d.id],sid,added=cards.length,removed=0;
  if(old){var oi={},ni={};old.cards.forEach(function(x){oi[x.id]=1;});cards.forEach(function(x){ni[x.id]=1;});
    added=cards.filter(function(x){return !oi[x.id];}).length;removed=old.cards.filter(function(x){return !ni[x.id];}).length;}
  if(old&&old.subject&&!d.subject)sid=old.subject;
  else if(d.subject)sid=ensureSubject(String(d.subject));
  else if(S.currentSubject)sid=S.currentSubject;
  else sid=ensureSubject('General');
  var scen=normScenarios(obj.scenarios,fname),mn=normMnemonics(obj.mnemonics,fname);
  S.decks[d.id]={id:d.id,title:d.title||d.id,standard:d.standard||'',subject:sid,custom:!!(old&&old.custom),cards:cards,scenarios:scen,mnemonics:mn};
  if(!S.currentSubject||!S.subjects[S.currentSubject])S.currentSubject=sid;
  return {title:d.title||d.id,n:cards.length,updated:!!old,subject:S.subjects[sid].name,added:added,removed:removed};
}

function handleFiles(files){
  if(!files.length)mergeMode=false;
  var list=Array.prototype.slice.call(files),msgs=[],pending=list.length;if(!pending)return;
  list.forEach(function(f){
    var r=new FileReader();
    r.onload=function(){
      try{
        if(/\.(csv|tsv|txt)$/i.test(f.name)){
          var cr=importCsv(r.result,f.name);
          if(cr)msgs.push('Imported '+cr.title+' ('+cr.n+' cards'+(cr.skipped?', '+cr.skipped+' rows skipped':'')+') in '+cr.subject);
          else msgs.push('Import cancelled');
          if(--pending===0){save();toast(summarize(msgs));render();}
          return;
        }
        var obj=JSON.parse(r.result);

function shrinkImage(file,done){

/* ---- CSV / Quizlet ---- */
function parseCsv(t){
  t=String(t).replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  var first=t.split('\n')[0]||'',tabs=(first.match(/\t/g)||[]).length,com=(first.match(/,/g)||[]).length,sem=(first.match(/;/g)||[]).length;
  var d=tabs>0&&tabs>=com?'\t':(sem>com?';':',');
  var rows=[],row=[],cur='',q=false,i=0;
  for(;i<t.length;i++){
    var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"'&&cur==='')q=true;
    else if(ch===d){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim();});});
}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
function importCsv(text,fname){
  var rows=parseCsv(text);if(!rows.length)throw new Error(fname+': no rows found.');
  var hd=rows[0].map(function(x){return x.trim().toLowerCase();});
  var names={front:['front','question','term','q'],back:['back','answer','definition','a'],area:['topic','area','category','chapter'],source:['source'],page:['page'],image:['image']};
  var col={},isHead=false;
  Object.keys(names).forEach(function(k){hd.forEach(function(x,i){if(names[k].indexOf(x)>-1&&col[k]===undefined){col[k]=i;isHead=true;}});});
  var start=0;
  if(isHead&&col.front!==undefined&&col.back!==undefined)start=1;
  else{col={front:0,back:1,area:rows[0].length>2?2:undefined};}
  var base=fname.replace(/\.[^.]+$/,'');
  var title=prompt('Name this deck:',base);if(title===null)return null;title=title.trim()||base;
  var seen={},cards=[],skipped=0;
  for(var r=start;r<rows.length;r++){
    var x=rows[r],f=(x[col.front]||'').trim(),b=(x[col.back]||'').trim();
    if(!f||!b){skipped++;continue;}
    var id='r'+hash(f),n=1;while(seen[id]){id='r'+hash(f)+'-'+(++n);}seen[id]=1;
    var card={id:id,front:f,back:b,area:col.area!==undefined?(x[col.area]||'').trim():''};
    if(col.source!==undefined)card.source=(x[col.source]||'').trim();
    if(col.page!==undefined)card.page=(x[col.page]||'').trim();
    if(col.image!==undefined)card.image=safeImg((x[col.image]||'').trim());
    cards.push(card);
  }
  if(!cards.length)throw new Error(fname+': no usable rows (each needs a term and a definition).');
  var res=importDeck({deck:{id:'csv-'+slug(title),title:title,standard:'Imported from '+fname,subject:subj()?subj().name:''},cards:cards},fname);
  res.skipped=skipped;return res;
}

function mergeBackup(obj){

  Object.keys(b.overrides||{}).forEach(function(k){if(!S.overrides[k])S.overrides[k]=b.overrides[k];});
  Object.keys(b.history||{}).forEach(function(k){S.history[k]=Math.max(S.history[k]||0,b.history[k]||0);});

var NUMU='KIAS|KCAS|KTAS|KTS|kts|kt|knots|MHz|kHz|feet|ft|NM|nm|SM|statute miles?|nautical miles?|miles|hours?|hrs?|minutes?|mins?|seconds?|days?|calendar months?|months?|years?|gallons?|gal|psi|lbs?|pounds|RPM|inches|inHg|degrees|mph|volts?|amps?|percent|%|°C|°F|°';
function numMatches(t){
  var re=new RegExp('(^|[^\\w.])(\\d{1,3}(?:,\\d{3})+|\\d+(?:\\.\\d+)?)\\s?('+NUMU+')(?![A-Za-z])','g'),o=[],x;

function numItems(r,max){

  });

function normMnemonics(arr,fname){

    if(!m||typeof m.id!=='string'||!m.id||typeof m.title!=='string')throw new Error(fname+': mnemonic #'+(i+1)+' needs an id and a title.');

      items:m.items.map(function(x,j){if(!x||typeof x.w!=='string'||!x.w.trim())throw new Error(fname+': mnemonic "'+m.id+'" item '+(j+1)+' needs a word ("w").');return {w:x.w.trim(),l:typeof x.l==='string'&&x.l?x.l:'',d:typeof x.d==='string'?x.d:''};})};

  var h='<div class="study"><div class="gtop"><span id="gtime">'+Math.ceil(speedLeft()/1000)+'s</span><span class="gs">Score <b>'+g.score+'</b></span><span class="gs">Streak <b>'+g.streak+'</b> &middot; x'+mult+'</span></div>';
  h+='<div class="gbarw"><i id="gbar" style="width:'+(100*speedLeft()/g.dur)+'%"></i></div>';
  h+='<div class="card gq"><div class="front">'+fmt(q.c.front)+'</div></div><div class="gopts">';
  q.opts.forEach(function(o,i){
    var cls='gopt';if(q.pick>-1){if(i===q.ans)cls+=' good';else if(i===q.pick)cls+=' bad';}
    h+='<button class="'+cls+'" data-act="g_ans" data-i="'+i+'"><kbd>'+(i+1)+'</kbd> '+esc(o)+'</button>';});
  h+='</div><div class="hint">Keys <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd></div></div>';
  mainEl.innerHTML=h;
}
function speedAnswer(i){
  var g=game;if(!g||g.type!=='speed'||g.phase!=='play'||g.locked||speedLeft()<=0)return;
  g.locked=true;g.q.pick=i;
  var ok=i===g.q.ans;
  if(ok){g.streak++;g.maxStreak=Math.max(g.maxStreak,g.streak);g.right++;g.score+=10*Math.min(5,1+Math.floor((g.streak-1)/3));gameMark(g.q.c,false);}
  else{g.streak=0;g.wrong.push(g.q.c);gameMark(g.q.c,true);}
  save();paintSpeed();
  g.to=setTimeout(function(){
    if(!game||game.type!=='speed'||game.phase!=='play')return;
    game.locked=false;
    if(speedLeft()<=0){endSpeed();return;}
    if(!speedQ()){endSpeed();return;}
    paintSpeed();
  },ok?450:1300);
}
function endSpeed(){
  var g=game;if(!g||g.phase==='end')return;
  stopGame();g.phase='end';
  var b=bestOf('speed');g.newBest=g.score>(b.best||0);
  setBest('speed',{best:Math.max(b.best||0,g.score),plays:(b.plays||0)+1});save();
  render();
}

/* match */
function startMatch(){
  var pool=gamePool('match');
  if(pool.length<4){toast('Not enough short cards in this selection.');return;}
  game={type:'match',phase:'play',pool:shuffle(pool),pos:0,rounds:0,mist:0,total:0,sel:null,timer:null,to:null};
  matchRound();render();
}
function matchRound(){
  var g=game,pairs=[],seen={};
  while(g.pos<g.pool.length&&pairs.length<6){
    var c=g.pool[g.pos++],k=plain(c.back).trim().toLowerCase();
    if(seen[k])continue;seen[k]=1;pairs.push(c);
  }
  if(pairs.length<3&&g.rounds>0){g.phase='end';return;}
  g.pairs=pairs;g.left=shuffle(pairs.map(function(c,i){return i;}));g.right=shuffle(pairs.map(function(c,i){return i;}));
  g.done={};g.missed={};g.sel=null;g.flash=null;g.rm=0;g.t0=Date.now();g.phase='play';
  stopGame();g.timer=setInterval(function(){var t=$('gtime');if(t&&game&&game.type==='match'&&game.phase==='play')t.textContent=((Date.now()-game.t0)/1000).toFixed(0)+'s';},500);
}
function paintMatch(){
  var g=game;
  if(g.phase==='end'){
    mainEl.innerHTML='<h1>All done</h1><p class="sub">'+g.total+' pairs matched with '+g.mist+' mistake'+(g.mist===1?'':'s')+'. Cards you mismatched are back in your review schedule.</p><div class="row"><button class="btn" data-act="g_match">Play again</button><button class="btn ghost" data-act="g_menu">Back to games</button></div>';return;
  }
  if(g.phase==='roundend'){
    var more=g.pos<g.pool.length;
    mainEl.innerHTML='<h1>Round complete</h1><div class="grid"><div class="stat"><b>'+g.secs+'s</b><span>time'+(g.newBest?' (new best!)':'')+'</span></div><div class="stat"><b>'+g.rm+'</b><span>mistakes</span></div></div><div class="row" style="margin-top:18px">'+(more?'<button class="btn" data-act="g_next">Next round</button>':'')+'<button class="btn ghost" data-act="g_finish">'+(more?'Finish':'See results')+'</button></div>';return;
  }
  var h='<div class="study" style="max-width:900px"><div class="gtop"><span id="gtime">'+Math.round((Date.now()-g.t0)/1000)+'s</span><span class="gs">Round '+(g.rounds+1)+'</span><span class="gs">Mistakes <b>'+g.rm+'</b></span></div><div class="mcols"><div>';
  g.left.forEach(function(i){var cls='mbtn';if(g.done[i])cls+=' done';if(g.sel&&g.sel.side==='L'&&g.sel.i===i)cls+=' sel';if(g.flash&&g.flash.indexOf('L'+i)>-1)cls+=' bad';
    h+='<button class="'+cls+'" data-act="g_pm" data-side="L" data-i="'+i+'"'+(g.done[i]?' disabled':'')+'>'+fmt(g.pairs[i].front)+'</button>';});
  h+='</div><div>';
  g.right.forEach(function(i){var cls='mbtn';if(g.done[i])cls+=' done';if(g.sel&&g.sel.side==='R'&&g.sel.i===i)cls+=' sel';if(g.flash&&g.flash.indexOf('R'+i)>-1)cls+=' bad';
    h+='<button class="'+cls+'" data-act="g_pm" data-side="R" data-i="'+i+'"'+(g.done[i]?' disabled':'')+'>'+fmt(g.pairs[i].back)+'</button>';});
  h+='</div></div><div class="hint">Click a question, then its answer (or the other way around).</div></div>';
  mainEl.innerHTML=h;
}
function matchPick(side,i){
  var g=game;if(!g||g.type!=='match'||g.phase!=='play'||g.flash)return;
  if(g.done[i])return;
  if(!g.sel||g.sel.side===side){g.sel={side:side,i:i};paintMatch();return;}
  var l=side==='L'?i:g.sel.i,r=side==='R'?i:g.sel.i;
  if(l===r){
    g.done[l]=1;g.sel=null;g.total++;
    if(Object.keys(g.done).length===g.pairs.length){
      stopGame();var secs=Math.round((Date.now()-g.t0)/1000);g.secs=secs;
      g.pairs.forEach(function(c,k){gameMark(c,!!g.missed[k]);});
      var b=bestOf('match');g.newBest=!b.bestTime||secs<b.bestTime;
      setBest('match',{bestTime:g.newBest?secs:b.bestTime,plays:(b.plays||0)+1});save();
      g.rounds++;g.phase='roundend';
    }
    paintMatch();
  }else{
    g.mist++;g.rm++;g.missed[l]=1;g.flash=['L'+l,'R'+r];g.sel=null;paintMatch();
    g.to=setTimeout(function(){if(game&&game.type==='match'){game.flash=null;paintMatch();}},500);
  }
}

/* scenario flight */
function scenarioList(){
  var out=[];

function startScen(i){

  game={type:'scen',phase:'play',sc:x.s,step:0,score:0,pick:-1,order:null,log:[],timer:null,to:null};

}
function scenStep(){
  var st=game.sc.steps[game.step];
  game.order=shuffle(st.choices.map(function(c,i){return i;}));game.pick=-1;
}
function paintScen(){
  var g=game,sc=g.sc,n=sc.steps.length;
  if(g.phase==='end'){
    var h='<h1>'+esc(sc.title)+'</h1><div class="grid"><div class="stat"><b>'+g.score+' / '+n+'</b><span>best decisions</span></div></div><h2>Your decisions</h2><div class="card list">';
    g.log.forEach(function(l,i){h+='<div class="item"><div class="main"><div class="t">'+(l.ok?'✓ ':'✗ ')+fmt(l.q)+'</div><div class="m">You chose: '+fmt(l.chose)+'</div>'+(l.ok?'':'<div class="m">Better: '+fmt(l.best)+'</div>')+'</div></div>';});

    mainEl.innerHTML=h;return;
  }
  var st=sc.steps[g.step],h='<div class="study"><div class="meta"><span>'+esc(sc.title)+'</span><span>Decision '+(g.step+1)+' / '+n+'</span></div>';
  if(sc.verify)h+='<div class="vbox" style="margin:0 0 12px"><span>This scenario is a study aid and has not been checked against your POH or instructor. Treat your POH as the authority.</span></div>';
  if(g.step===0&&sc.intro)h+='<div class="card panel" style="margin-top:0"><div class="hd">Situation</div><div style="white-space:pre-wrap">'+fmt(sc.intro)+'</div></div>';
  h+='<div class="card gq"><div class="front">'+fmt(st.q)+'</div></div><div class="gopts">';
  g.order.forEach(function(ci,pos){
    var c=st.choices[ci],cls='gopt';
    if(g.pick>-1){if(c.ok)cls+=' good';else if(ci===g.pick)cls+=' bad';}
    h+='<button class="'+cls+'" data-act="g_ans" data-i="'+ci+'"'+(g.pick>-1?' disabled':'')+'><kbd>'+(pos+1)+'</kbd> '+fmt(c.t)+'</button>';
    if(g.pick>-1&&(ci===g.pick||c.ok)&&c.why)h+='<div class="gwhy">'+fmt(c.why)+'</div>';
  });
  h+='</div>';
  if(g.pick>-1)h+='<div class="row" style="margin-top:16px"><button class="btn" data-act="g_next">'+(g.step+1<n?'Next decision':'See results')+'</button></div>';
  h+='</div>';
  mainEl.innerHTML=h;
}
function scenAnswer(ci){
  var g=game;if(!g||g.type!=='scen'||g.phase!=='play'||g.pick>-1)return;
  var st=g.sc.steps[g.step],c=st.choices[ci];if(!c)return;
  g.pick=ci;if(c.ok)g.score++;
  var best=st.choices.filter(function(x){return x.ok;})[0];
  g.log.push({q:st.q,chose:c.t,ok:c.ok,best:best.t});
  paintScen();
}
function scenNext(){
  var g=game;if(!g||g.pick<0)return;
  if(g.step+1>=g.sc.steps.length){
    g.phase='end';var k='s:'+g.sc.id,b=bestOf(k);
    setBest(k,{best:Math.max(b.best||0,g.score),plays:(b.plays||0)+1});
    var t=today();S.history[t]=(S.history[t]||0)+1;save();paintScen();return;
  }
  g.step++;scenStep();paintScen();
}

function pickAction(a,el){
  if(!pick)return;
  var cur=Object.keys(S.decks).filter(function(i){return S.decks[i].subject===S.currentSubject;});
  if(a==='pk_subj'){pick.ids={};cur.forEach(function(i){pick.ids[i]=1;});renderPicker();}
  else if(a==='pk_none'){pick.ids={};renderPicker();}

  else if(a==='pk_saveset'){

  }

}

  if(a==='openrow'&&(e.target.closest('button')||e.target.tagName==='INPUT'))return;
  switch(a){
    case 'nav':closeModal();view=el.getAttribute('data-v');if(view!=='study')session=null;if(view==='verify')vq=null;if(view==='games')resetGame();if(view==='library')lib={topic:null,filter:'all',q:'',sel:{}};render();break;
    case 'home':if(session&&!session.cram&&session.done)maybeAutoBackup();view='home';session=null;render();break;
    case 'start':startDue();break;
    case 'cram':startSession(shuffle(activeCards().map(function(c){return c.key;})),{cram:true,title:'Practice'});break;
    case 'weak':startSession(activeCards().filter(isWeak).map(function(c){return c.key;}),{title:'Weak cards'});break;
    case 'needverify':vq=null;view='verify';render();break;
    case 'topic':lib={topic:el.getAttribute('data-a'),filter:'all',q:'',sel:{}};view='library';render();break;
    case 'alltopics':lib={topic:null,filter:'all',q:'',sel:{}};render();break;
    case 'filter':lib.filter=el.getAttribute('data-f');render();break;
    case 'selall':{var l=currentList(),all=l.length&&l.every(function(c){return lib.sel[c.key];});lib.sel={};if(!all)l.forEach(function(c){lib.sel[c.key]=1;});renderLibrary();break;}
    case 'studylist':{var ls=currentList(),sel=ls.filter(function(c){return lib.sel[c.key];});var use=sel.length?sel:ls;startSession(use.map(function(c){return c.key;}),{title:lib.topic||'Selection'});break;}
    case 'openrow':{var ls2=currentList(),i=parseInt(el.getAttribute('data-i'),10);startSession(ls2.map(function(c){return c.key;}),{start:i,title:lib.topic||'Browse'});break;}
    case 'flipcard':flipCard();break;
    case 'rate':rate(parseInt(el.getAttribute('data-r'),10));break;
    case 'next':if(session){session.idx++;session.revealed=false;render();}break;
    case 'prev':if(session&&session.idx>0){session.idx--;session.revealed=false;render();}break;
    case 'flag':if(S.flags[k])delete S.flags[k];else S.flags[k]=1;save();render();break;
    case 'markverified':clearFlags(k);toast('Cleared');render();break;
    case 'addcard':openEditor(null);break;
    case 'editcard':openEditor(k);break;
    case 'closemodal':closeModal();break;
    case 'savecard':saveEditor(k||null);break;
    case 'revertcard':if(confirm('Discard your edits to this card and restore the imported version?')){delete S.overrides[k];save();closeModal();render();}break;
    case 'delcard':if(confirm('Delete this card? Its progress and notes are removed too.')){
        var i2=k.indexOf(':'),d=S.decks[k.slice(0,i2)],cid=k.slice(i2+1);
        d.cards=d.cards.filter(function(c){return c.id!==cid;});delete S.progress[k];delete S.notes[k];delete S.flags[k];
        if(session){session.queue=session.queue.filter(function(x){return x!==k;});}
        save();closeModal();render();}break;
    case 'bold':toggleBold(el.getAttribute('data-t'));break;
    case 'g_speed':startSpeed();break;
    case 'g_match':startMatch();break;
    case 'g_scen':startScen(parseInt(el.getAttribute('data-i'),10));break;
    case 'g_scen_again':{var sid0=game&&game.sc&&game.sc.id,li=scenarioList().map(function(x){return x.s.id;}).indexOf(sid0);if(li>-1)startScen(li);break;}
    case 'g_menu':resetGame();render();break;
    case 'g_finish':if(game){stopGame();game.phase='end';render();}break;
    case 'g_next':if(game&&game.type==='scen')scenNext();else if(game&&game.type==='match'){matchRound();render();}break;
    case 'g_ans':if(game&&game.type==='speed')speedAnswer(parseInt(el.getAttribute('data-i'),10));else scenAnswer(parseInt(el.getAttribute('data-i'),10));break;
    case 'g_pm':matchPick(el.getAttribute('data-side'),parseInt(el.getAttribute('data-i'),10));break;
    case 'search':openSearch();break;
    case 'gsopen':openFromSearch(k);break;
    case 'help':openHelp();break;
    case 'more':openMore();break;
    case 'pickdecks':openPicker();break;
    case 'pk_subj':case 'pk_none':case 'pk_due':case 'pk_saveset':case 'pk_useset':case 'pk_delset':case 'pk_apply':pickAction(a,el);break;
    case 'vok':vokNow();break;
    case 'vedit':if(vq&&vq.queue[vq.idx])openEditor(vq.queue[vq.idx]);break;
    case 'vskip':if(vq){vq.idx++;render();}break;
    case 'vprev':if(vq&&vq.idx>0){vq.idx--;render();}break;
    case 'vrebuild':vq=null;render();break;
    case 'persist':persistState='unknown';checkPersist();setTimeout(function(){if(view==='settings')render();},600);break;
    case 'snaprestore':{var sn=getSnaps()[parseInt(el.getAttribute('data-i'),10)];
        if(sn&&confirm('Restore the snapshot from the start of '+sn.date+'? Everything you did since then is replaced. You can undo this from Settings.')){
          try{localStorage.setItem(UNDOKEY,JSON.stringify(S));}catch(e){}
          S=migrate(JSON.parse(sn.data));vq=null;session=null;readOnly=false;save();toast('Snapshot restored');render();}break;}
    case 'undorestore':{var raw=null;try{raw=localStorage.getItem(UNDOKEY);}catch(e){}
        if(raw&&confirm('Undo the last restore and go back to what you had before it?')){
          S=migrate(JSON.parse(raw));try{localStorage.removeItem(UNDOKEY);}catch(e){}vq=null;session=null;save();toast('Restore undone');render();}break;}
    case 'import':fileIn.click();break;
    case 'newsubj':if(newSubject()){view='home';render();}break;
    case 'delsubj':{var sb=subj();if(sb&&confirm('Delete the subject "'+sb.name+'" with all its decks, your cards, progress and notes? This cannot be undone.')){
        Object.keys(S.decks).forEach(function(id){if(S.decks[id].subject===sb.id){
          S.decks[id].cards.forEach(function(c){var kk=id+':'+c.id;delete S.progress[kk];delete S.notes[kk];delete S.flags[kk];delete S.overrides[kk];});delete S.decks[id];}});
        delete S.subjects[sb.id];S.currentSubject=Object.keys(S.subjects)[0]||'';save();view='home';session=null;render();}break;}
    case 'deldeck':{var id=el.getAttribute('data-d');if(confirm('Remove this deck? Progress, notes and edits for its cards are kept in case you re-import it.')){delete S.decks[id];save();render();}break;}
    case 'exportdeck':{
      var dk=S.decks[el.getAttribute('data-d')];
      var cs=dk.cards.map(function(c){var m=applyOv(c,dk.id+':'+c.id);return{id:m.id,area:m.area,task:m.task,acs:m.acs,type:m.type,front:m.front,back:m.back,followups:m.followups,source:m.source,page:m.page||'',verify:!!m.verify,volatile:!!m.volatile,checked:m.checked||'',links:m.links||[],image:m.image||''};});
      download(slug(dk.title)+'.deck.json',{format:'checkride-deck',version:1,deck:{id:dk.id,title:dk.title,standard:dk.standard,subject:(S.subjects[dk.subject]||{}).name||''},cards:cs,scenarios:dk.scenarios||[],mnemonics:dk.mnemonics||[]});break;}
    case 'backup':doBackup(false);toast('Backup exported. Move it to a safe folder such as iCloud Drive.');renderSettings();break;
    case 'reset':if(confirm('Erase all subjects, decks, progress, and notes from this browser? This cannot be undone.')&&confirm('Really erase everything?')){S=migrate(defaults());save();session=null;view='home';render();}break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='gs'){gsRender();return;}
  if(t.id==='pk_name'&&pick){pick.name=t.value;return;}
  if(t.id==='note'&&session){var key=session.queue[session.idx];if(t.value)S.notes[key]=t.value;else delete S.notes[key];save();}
});
document.addEventListener('keydown',function(e){
  var modalOn=$('modal').classList.contains('on');
  if((e.metaKey||e.ctrlKey)&&(e.key||'').toLowerCase()==='b'&&e.target&&(e.target.id==='e_front'||e.target.id==='e_back')){e.preventDefault();toggleBold(e.target.id);return;}
  if(e.key==='Escape'&&modalOn){closeModal();return;}
  if((e.metaKey||e.ctrlKey)&&(e.key||'').toLowerCase()==='k'){e.preventDefault();openSearch();return;}
  if(e.target&&e.target.id==='gs'&&e.key==='Enter'){var r=searchAll($('gs').value);if(r[0])openFromSearch(r[0].key);return;}
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='textarea'||tag==='input'||tag==='select'||modalOn)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();openSearch();return;}
  if(e.key==='?'){openHelp();return;}
  if(view==='games'&&game){
    if(game.type==='speed'&&'1234'.indexOf(e.key)>-1&&e.key&&game.phase==='play'){speedAnswer(parseInt(e.key,10)-1);return;}
    if(game.type==='scen'&&game.phase==='play'){
      if('1234'.indexOf(e.key)>-1&&e.key&&game.pick<0){var ci2=game.order[parseInt(e.key,10)-1];if(ci2!==undefined)scenAnswer(ci2);return;}
      if((e.key==='Enter'||e.code==='Space')&&game.pick>-1){e.preventDefault();scenNext();return;}
    }
    return;
  }
  if(view==='verify'&&vq){
    var k0=(e.key||'').toLowerCase();
    if(k0==='v')vokNow();
    else if(k0==='e'&&vq.queue[vq.idx])openEditor(vq.queue[vq.idx]);
    else if(k0==='s'||e.key==='ArrowRight'){vq.idx++;render();}
    else if(e.key==='ArrowLeft'&&vq.idx>0){vq.idx--;render();}
    return;
  }
  if(view!=='study'||!session||session.idx>=session.queue.length)return;
  var kk=(e.key||'').toLowerCase(),ck=session.queue[session.idx];
  if(kk==='f'){if(S.flags[ck])delete S.flags[ck];else S.flags[ck]=1;save();render();return;}
  if(kk==='e'){openEditor(ck);return;}
  if(kk==='v'){var cv=getCard(ck);if(cv&&attn(cv)){clearFlags(ck);toast('Cleared');render();}return;}
  if(kk==='n'&&session.revealed){var nt=$('note');if(nt){e.preventDefault();nt.focus();}return;}
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();flipCard();}
  else if(session.revealed&&'1234'.indexOf(e.key)>-1&&e.key)rate(parseInt(e.key,10));
  else if(e.key==='ArrowRight'){session.idx++;session.revealed=false;render();}
  else if(e.key==='ArrowLeft'&&session.idx>0){session.idx--;session.revealed=false;render();}
});
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal();});

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='e_type'){
    var cl=t.value==='cloze',a=$('e_flbl'),b=$('e_blbl'),btn=$('e_clbtn');
    if(a)a.firstChild.nodeValue=cl?'Text (wrap hidden words in {{double braces}}) ':'Question ';
    if(b)b.firstChild.nodeValue=cl?'Extra note (optional) ':'Answer ';
    if(btn)btn.hidden=!cl;
  }else if(t.id==='themesel'){S.settings.theme=t.value;save();applyTheme();toast('Theme: '+themeLabel());}
});
document.addEventListener('input',function(e){
  if(e.target.id==='wx_st'){S.settings.wxStations=e.target.value;save();var l=$('wx_link');if(l)l.href=wxUrl(e.target.value);}
});
document.addEventListener('keydown',function(e){
  if(!game||game.type!=='mc'||view!=='games'||game.phase!=='play')return;
  var tag=(e.target.tagName||'').toLowerCase();if(tag==='textarea'||tag==='input'||$('modal').classList.contains('on'))return;
  if('1234'.indexOf(e.key)>-1&&e.key){mcAnswer(parseInt(e.key,10)-1);}
  else if((e.key==='Enter'||e.code==='Space')&&game.pick>-1&&!game.dur){e.preventDefault();mcNext();}
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  switch(a){
    case 'clozebtn':{var ta=$('e_front');if(!ta)break;var s=ta.selectionStart,e2=ta.selectionEnd;if(s===e2){toast('Select the words to hide first.');break;}ta.value=ta.value.slice(0,s)+'{{'+ta.value.slice(s,e2)+'}}'+ta.value.slice(e2);break;}
    case 'theme':cycleTheme();closeModal();break;
    case 'g_cloze':startMc('cloze',clozeItems(Math.random,10),0,'Fill the blank');break;
    case 'g_num':startMc('num',numItems(Math.random,40),60000,'Number sprint');break;
    case 'g_wx':startMc('wx',wxItems(Math.random,8),0,'Weather decode');break;
    case 'g_daily':startDaily();break;
    case 'g_mix':startMix();break;
    case 'g_order':startSeq('order');break;
    case 'g_mnem':startSeq('mnem');break;
    case 'mc_ans':mcAnswer(parseInt(el.getAttribute('data-i'),10));break;
    case 'mc_next':mcNext();break;
    case 'seq_pick':seqPick(parseInt(el.getAttribute('data-i'),10));break;
    case 'seq_next':seqNext();break;
    case 'wx_open':openWx();break;
    case 'wx_save':{var ta2=$('wx_txt');if(ta2&&wxSave(ta2.value)){closeModal();if(view==='games')render();}break;}
    case 'wx_clip':{if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){var x=$('wx_txt');if(x){x.value=t;toast('Pasted. Now tap Save reports.');}}).catch(function(){toast('Clipboard was blocked. Paste into the box by hand.');});}else toast('Clipboard is not available here. Paste into the box by hand.');break;}
    case 'wx_clear':S.wx=null;save();closeModal();render();toast('Using sample reports');break;
  }
});

applyTheme();
snapshot();save();render();checkPersist();
})();

</script>
